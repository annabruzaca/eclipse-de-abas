<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse de Abas - Aba em Hibernação</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/suspended-favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/suspended-favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/suspended-favicon-48.png">
  <link rel="stylesheet" href="suspended.css">
</head>
<body>
  <div class="stars-bg"></div>
  <div class="twinkling"></div>
  <div class="horizon" aria-hidden="true"></div>

  <main class="eclipse-container" id="main-container">
    <!-- Visual Celestial do Eclipse -->
    <div class="eclipse-sphere-wrapper">
      <div class="corona-glow"></div>
      <div class="sun-body"></div>
      <div class="moon-shadow"></div>
      <div class="orbital-ring"></div>
    </div>

    <!-- Informações da Aba Eclipsada -->
    <div class="tab-card">
      <div class="favicon-badge" id="favicon-wrapper">
        <img id="tab-favicon" src="" alt="Favicon" class="favicon-img" onerror="this.src='../assets/icons/icon48.png'">
      </div>

      <div class="badge-tag">
        <span class="pulse-dot"></span>
        Aba em Modo Eclipse
      </div>

      <h1 class="tab-title" id="tab-title">Carregando...</h1>
      <p class="tab-domain" id="tab-domain">exemplo.com</p>

      <!-- Economia de Memória -->
      <div class="stats-pill">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span><strong>~150 MB</strong> de RAM preservados</span>
      </div>

      <!-- Ação de Despertar -->
      <button class="wake-btn" id="wake-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        Despertar Aba
      </button>

      <p class="hint-text">Ou clique em qualquer lugar da tela / pressione <strong>Espaço</strong></p>
    </div>

    <!-- Rodapé com Dica Celestial -->
    <footer class="space-footer">
      <p class="quote-text" id="quote-text">"As estrelas não podem brilhar sem a escuridão."</p>
    </footer>
  </main>

  <script src="suspended.js"></script>
</body>
</html>
